# CI per AGENTS.md: typecheck/lint/format/test/build; never anything that
# calls a paid API. Integration tests skip themselves without DATABASE_URL,
# and evals are deliberately not wired in.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads the pinned packageManager field
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
